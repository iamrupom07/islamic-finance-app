name: ci
on: [push, pull_request]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amanah_test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: amanah_test_ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ./amanah-backend
    env:
      DIRECT_URL: postgresql://amanah_test:test-ci-only@localhost:5432/amanah_test_ci
      TEST_DATABASE_URL: postgresql://amanah_test:test-ci-only@localhost:5432/amanah_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm test
      - run: pnpm db:migrate:deploy && pnpm test:integration
      - run: pnpm openapi:check && pnpm build
      - run: docker build -t amanah-api:ci .

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./amanah-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm test && pnpm api:check && pnpm content:verify && pnpm routes:check && pnpm i18n:check
      - run: pnpm exec expo export --platform android --no-bytecode --output-dir /tmp/android-bundle --max-workers 2
        env:
          EXPO_OFFLINE: "1"
          CI: "1"
      - run: pnpm exec expo export --platform ios --no-bytecode --output-dir /tmp/ios-bundle --max-workers 2
        env:
          EXPO_OFFLINE: "1"
          CI: "1"

